<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="-apple-system, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, Helvetica, Arial, sans-serif">
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.10"/></filter>
  <filter id="shs" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.06"/></filter>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00A88A"/><stop offset="1" stop-color="#0071E3"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#00A88A" stop-opacity="0.22"/><stop offset="1" stop-color="#00A88A" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="360" rx="28" fill="#F5F5F7"/>
<g filter="url(#shs)"><rect x="40" y="40" width="284" height="280" rx="22" fill="#FFFFFF"/></g>
<circle cx="84" cy="96" r="20" fill="#00A88A" fill-opacity="0.14"/>
<text x="84" y="103" text-anchor="middle" font-size="19" font-weight="700" fill="#00A88A">1</text>
<text x="68" y="176" font-size="34" font-weight="700" letter-spacing="-1" fill="#1D1D1F">Sees</text>
<text x="68" y="220" font-size="16.5" fill="#1D1D1F">The camera finds your hands.</text>
<text x="68" y="246" font-size="16.5" fill="#6E6E73">Frames never leave the phone.</text>
<text x="68" y="290" font-size="13" font-weight="600" letter-spacing="1.2" fill="#6E6E73">ANDROID</text>
<g filter="url(#shs)"><rect x="348" y="40" width="284" height="280" rx="22" fill="#FFFFFF"/></g>
<circle cx="392" cy="96" r="20" fill="#00A88A" fill-opacity="0.14"/>
<text x="392" y="103" text-anchor="middle" font-size="19" font-weight="700" fill="#00A88A">2</text>
<text x="376" y="176" font-size="34" font-weight="700" letter-spacing="-1" fill="#1D1D1F">Understands</text>
<text x="376" y="220" font-size="16.5" fill="#1D1D1F">21 points tracked per hand.</text>
<text x="376" y="246" font-size="16.5" fill="#6E6E73">Gestures become intent.</text>
<text x="376" y="290" font-size="13" font-weight="600" letter-spacing="1.2" fill="#6E6E73">ANDROID</text>
<g filter="url(#shs)"><rect x="656" y="40" width="284" height="280" rx="22" fill="#FFFFFF"/></g>
<circle cx="700" cy="96" r="20" fill="#0071E3" fill-opacity="0.14"/>
<text x="700" y="103" text-anchor="middle" font-size="19" font-weight="700" fill="#0071E3">3</text>
<text x="684" y="176" font-size="34" font-weight="700" letter-spacing="-1" fill="#1D1D1F">Sends</text>
<text x="684" y="220" font-size="16.5" fill="#1D1D1F">Only small control messages.</text>
<text x="684" y="246" font-size="16.5" fill="#6E6E73">Encrypted, pinned TLS.</text>
<text x="684" y="290" font-size="13" font-weight="600" letter-spacing="1.2" fill="#6E6E73">NETWORK</text>
<g filter="url(#shs)"><rect x="964" y="40" width="284" height="280" rx="22" fill="#FFFFFF"/></g>
<circle cx="1008" cy="96" r="20" fill="#0071E3" fill-opacity="0.14"/>
<text x="1008" y="103" text-anchor="middle" font-size="19" font-weight="700" fill="#0071E3">4</text>
<text x="992" y="176" font-size="34" font-weight="700" letter-spacing="-1" fill="#1D1D1F">Moves</text>
<text x="992" y="220" font-size="16.5" fill="#1D1D1F">Your real cursor moves.</text>
<text x="992" y="246" font-size="16.5" fill="#6E6E73">Released the instant you stop.</text>
<text x="992" y="290" font-size="13" font-weight="600" letter-spacing="1.2" fill="#6E6E73">WINDOWS</text>
</svg>
