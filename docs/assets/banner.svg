<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="1" stop-color="#0D2236"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62E6C5"/>
      <stop offset="1" stop-color="#8BCBFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#62E6C5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#62E6C5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8BCBFF" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>

  <!-- Title -->
  <g transform="translate(72 0)">
    <text x="0" y="168" font-size="76" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Gesture<tspan fill="url(#accent)">Link</tspan></text>
    <text x="2" y="218" font-size="26" fill="#B9C7D8">Control your Windows PC with hand gestures,</text>
    <text x="2" y="252" font-size="26" fill="#B9C7D8">using only your Android phone's camera.</text>
    <g font-size="16" font-weight="600">
      <rect x="2" y="290" width="150" height="36" rx="18" fill="#62E6C5" fill-opacity="0.12" stroke="#62E6C5" stroke-opacity="0.5"/>
      <text x="77" y="314" text-anchor="middle" fill="#62E6C5">On-device AI</text>
      <rect x="166" y="290" width="160" height="36" rx="18" fill="#8BCBFF" fill-opacity="0.12" stroke="#8BCBFF" stroke-opacity="0.5"/>
      <text x="246" y="314" text-anchor="middle" fill="#8BCBFF">Pinned TLS</text>
      <rect x="340" y="290" width="170" height="36" rx="18" fill="#FFC857" fill-opacity="0.12" stroke="#FFC857" stroke-opacity="0.5"/>
      <text x="425" y="314" text-anchor="middle" fill="#FFC857">No cloud</text>
    </g>
  </g>

  <!-- Phone -->
  <g transform="translate(760 70)">
    <circle cx="80" cy="130" r="150" fill="url(#glow)"/>
    <rect x="0" y="0" width="160" height="270" rx="24" fill="#101D2E" stroke="#2A3D55" stroke-width="3"/>
    <rect x="10" y="16" width="140" height="238" rx="14" fill="#07111F"/>
    <circle cx="80" cy="9" r="3" fill="#2A3D55"/>
    <!-- hand skeleton -->
    <g stroke="#62E6C5" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M80 215 L52 185 L40 160 L32 138"/>
      <path d="M80 215 L66 160 L62 128 L60 104"/>
      <path d="M80 215 L82 156 L84 120 L85 92"/>
      <path d="M80 215 L96 160 L102 128 L106 106"/>
      <path d="M80 215 L110 170 L120 150 L128 132"/>
      <path d="M66 160 L82 156 L96 160 L110 170" stroke-opacity="0.6"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="80" cy="215" r="5"/>
      <circle cx="32" cy="138" r="4"/><circle cx="60" cy="104" r="4"/><circle cx="85" cy="92" r="4"/><circle cx="106" cy="106" r="4"/><circle cx="128" cy="132" r="4"/>
      <circle cx="40" cy="160" r="3"/><circle cx="62" cy="128" r="3"/><circle cx="84" cy="120" r="3"/><circle cx="102" cy="128" r="3"/><circle cx="120" cy="150" r="3"/>
    </g>
    <circle cx="80" cy="185" r="14" fill="none" stroke="#FFC857" stroke-width="3"/>
  </g>

  <!-- Link -->
  <g>
    <path d="M940 205 C 980 205, 990 205, 1030 205" stroke="url(#accent)" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round" fill="none"/>
    <rect x="958" y="178" width="54" height="22" rx="11" fill="#101D2E" stroke="#2A3D55"/>
    <text x="985" y="194" font-size="12" font-weight="700" text-anchor="middle" fill="#8BCBFF">TLS</text>
  </g>

  <!-- Monitor -->
  <g transform="translate(1040 120)">
    <rect x="0" y="0" width="190" height="130" rx="12" fill="#101D2E" stroke="#2A3D55" stroke-width="3"/>
    <rect x="10" y="10" width="170" height="110" rx="6" fill="#0B1828"/>
    <rect x="22" y="22" width="70" height="8" rx="4" fill="#2A3D55"/>
    <rect x="22" y="38" width="110" height="8" rx="4" fill="#2A3D55"/>
    <path d="M40 92 C 70 60, 100 100, 120 72" stroke="#62E6C5" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="1 7"/>
    <path d="M120 72 l0 26 l7 -7 l6 13 l5 -2 l-6 -13 l10 0 z" fill="#FFFFFF" stroke="#07111F" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="80" y="130" width="30" height="22" fill="#2A3D55"/>
    <rect x="55" y="150" width="80" height="8" rx="4" fill="#2A3D55"/>
  </g>
</svg>
