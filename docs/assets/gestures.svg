<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <rect width="1280" height="300" rx="24" fill="#07111F"/>
  <g font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <!-- card template: 280 wide, gap 26, start 40 -->
    <g transform="translate(40 30)">
      <rect width="280" height="240" rx="18" fill="#101D2E"/>
      <text x="140" y="125" font-size="84">🖐️</text>
      <text x="140" y="182">Move</text>
      <text x="140" y="210" font-size="15" font-weight="400" fill="#8296AD">Open hand moves the cursor</text>
    </g>
    <g transform="translate(346 30)">
      <rect width="280" height="240" rx="18" fill="#101D2E"/>
      <text x="140" y="125" font-size="84">✊</text>
      <text x="140" y="182">Click · Drag · Draw</text>
      <text x="140" y="210" font-size="15" font-weight="400" fill="#8296AD">Fist holds the mouse button</text>
    </g>
    <g transform="translate(652 30)">
      <rect width="280" height="240" rx="18" fill="#101D2E"/>
      <text x="140" y="125" font-size="84">🙌</text>
      <text x="140" y="182">Zoom</text>
      <text x="140" y="210" font-size="15" font-weight="400" fill="#8296AD">Two hands apart / together</text>
    </g>
    <g transform="translate(958 30)">
      <rect width="280" height="240" rx="18" fill="#101D2E"/>
      <text x="140" y="125" font-size="84">👋</text>
      <text x="140" y="182">Scroll</text>
      <text x="140" y="210" font-size="15" font-weight="400" fill="#8296AD">Left open hand + right visible</text>
    </g>
  </g>
  <g fill="#62E6C5"><rect x="110" y="30" width="140" height="4" rx="2"/><rect x="416" y="30" width="140" height="4" rx="2" fill="#FFC857"/><rect x="722" y="30" width="140" height="4" rx="2" fill="#8BCBFF"/><rect x="1028" y="30" width="140" height="4" rx="2"/></g>
</svg>
