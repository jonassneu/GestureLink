<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8BCBFF"/>
    </marker>
  </defs>
  <rect width="1280" height="380" rx="24" fill="#07111F"/>

  <!-- Android panel -->
  <rect x="40" y="40" width="500" height="300" rx="18" fill="#101D2E" stroke="#62E6C5" stroke-opacity="0.45" stroke-width="2"/>
  <text x="70" y="82" font-size="24" font-weight="700" fill="#62E6C5">📱 Android phone</text>
  <text x="70" y="108" font-size="15" fill="#8296AD">Kotlin · Jetpack Compose · CameraX · MediaPipe</text>
  <g font-size="17" fill="#E6EEF7">
    <rect x="70" y="132" width="440" height="52" rx="12" fill="#07111F"/>
    <text x="92" y="164"><tspan font-weight="700" fill="#FFC857">1</tspan>   Front camera frames stay on the phone</text>
    <rect x="70" y="196" width="440" height="52" rx="12" fill="#07111F"/>
    <text x="92" y="228"><tspan font-weight="700" fill="#FFC857">2</tspan>   MediaPipe hand landmarks + filtering</text>
    <rect x="70" y="260" width="440" height="52" rx="12" fill="#07111F"/>
    <text x="92" y="292"><tspan font-weight="700" fill="#FFC857">3</tspan>   Gesture state machine → control events</text>
  </g>

  <!-- Link -->
  <line x1="556" y1="190" x2="722" y2="190" stroke="#8BCBFF" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="640" y="160" font-size="16" font-weight="700" text-anchor="middle" fill="#8BCBFF">🔒 TLS · pinned cert</text>
  <text x="640" y="222" font-size="14" text-anchor="middle" fill="#8296AD">move · click · scroll · zoom</text>
  <text x="640" y="242" font-size="14" text-anchor="middle" fill="#8296AD">LAN or USB · port 39827</text>

  <!-- Windows panel -->
  <rect x="740" y="40" width="500" height="300" rx="18" fill="#101D2E" stroke="#8BCBFF" stroke-opacity="0.45" stroke-width="2"/>
  <text x="770" y="82" font-size="24" font-weight="700" fill="#8BCBFF">🖥️ Windows agent</text>
  <text x="770" y="108" font-size="15" fill="#8296AD">.NET 10 · WPF · Win32 SendInput</text>
  <g font-size="17" fill="#E6EEF7">
    <rect x="770" y="132" width="440" height="52" rx="12" fill="#07111F"/>
    <text x="792" y="164"><tspan font-weight="700" fill="#FFC857">4</tspan>   QR pairing + device authentication</text>
    <rect x="770" y="196" width="440" height="52" rx="12" fill="#07111F"/>
    <text x="792" y="228"><tspan font-weight="700" fill="#FFC857">5</tspan>   Session safety, watchdog, ReleaseAll</text>
    <rect x="770" y="260" width="440" height="52" rx="12" fill="#07111F"/>
    <text x="792" y="292"><tspan font-weight="700" fill="#FFC857">6</tspan>   Real cursor, clicks, scroll and zoom</text>
  </g>
</svg>
