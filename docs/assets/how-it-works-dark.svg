<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="-apple-system, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, Helvetica, Arial, sans-serif">
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/></filter>
  <filter id="shs" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.36"/></filter>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#62E6C5"/><stop offset="1" stop-color="#2997FF"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#62E6C5" stop-opacity="0.22"/><stop offset="1" stop-color="#62E6C5" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="360" rx="28" fill="#000000"/>
<g filter="url(#shs)"><rect x="40" y="40" width="284" height="280" rx="22" fill="#1C1C1E"/></g>
<circle cx="84" cy="96" r="20" fill="#62E6C5" fill-opacity="0.14"/>
<text x="84" y="103" text-anchor="middle" font-size="19" font-weight="700" fill="#62E6C5">1</text>
<text x="68" y="176" font-size="34" font-weight="700" letter-spacing="-1" fill="#F5F5F7">Sees</text>
<text x="68" y="220" font-size="16.5" fill="#F5F5F7">The camera finds your hands.</text>
<text x="68" y="246" font-size="16.5" fill="#86868B">Frames never leave the phone.</text>
<text x="68" y="290" font-size="13" font-weight="600" letter-spacing="1.2" fill="#86868B">ANDROID</text>
<g filter="url(#shs)"><rect x="348" y="40" width="284" height="280" rx="22" fill="#1C1C1E"/></g>
<circle cx="392" cy="96" r="20" fill="#62E6C5" fill-opacity="0.14"/>
<text x="392" y="103" text-anchor="middle" font-size="19" font-weight="700" fill="#62E6C5">2</text>
<text x="376" y="176" font-size="34" font-weight="700" letter-spacing="-1" fill="#F5F5F7">Understands</text>
<text x="376" y="220" font-size="16.5" fill="#F5F5F7">21 points tracked per hand.</text>
<text x="376" y="246" font-size="16.5" fill="#86868B">Gestures become intent.</text>
<text x="376" y="290" font-size="13" font-weight="600" letter-spacing="1.2" fill="#86868B">ANDROID</text>
<g filter="url(#shs)"><rect x="656" y="40" width="284" height="280" rx="22" fill="#1C1C1E"/></g>
<circle cx="700" cy="96" r="20" fill="#2997FF" fill-opacity="0.14"/>
<text x="700" y="103" text-anchor="middle" font-size="19" font-weight="700" fill="#2997FF">3</text>
<text x="684" y="176" font-size="34" font-weight="700" letter-spacing="-1" fill="#F5F5F7">Sends</text>
<text x="684" y="220" font-size="16.5" fill="#F5F5F7">Only small control messages.</text>
<text x="684" y="246" font-size="16.5" fill="#86868B">Encrypted, pinned TLS.</text>
<text x="684" y="290" font-size="13" font-weight="600" letter-spacing="1.2" fill="#86868B">NETWORK</text>
<g filter="url(#shs)"><rect x="964" y="40" width="284" height="280" rx="22" fill="#1C1C1E"/></g>
<circle cx="1008" cy="96" r="20" fill="#2997FF" fill-opacity="0.14"/>
<text x="1008" y="103" text-anchor="middle" font-size="19" font-weight="700" fill="#2997FF">4</text>
<text x="992" y="176" font-size="34" font-weight="700" letter-spacing="-1" fill="#F5F5F7">Moves</text>
<text x="992" y="220" font-size="16.5" fill="#F5F5F7">Your real cursor moves.</text>
<text x="992" y="246" font-size="16.5" fill="#86868B">Released the instant you stop.</text>
<text x="992" y="290" font-size="13" font-weight="600" letter-spacing="1.2" fill="#86868B">WINDOWS</text>
</svg>
