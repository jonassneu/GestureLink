name: Windows
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore windows/GestureLink.Windows.sln
      - run: dotnet build windows/GestureLink.Windows.sln -c Release --no-restore
      - run: dotnet test windows/GestureLink.Windows.sln -c Release --no-build
      - run: dotnet publish windows/GestureLink.Windows.App/GestureLink.Windows.App.csproj -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false

